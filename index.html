function waveComposition(wave) {

  for (const bird of pterodactyls) bird.departing = true;
  if (!pterodactyls.length) {
    if (currentWave === 2) score += 3000;
    startWave(currentWave + 1);
  }
}
function update() {
  gameTime += 1 / 60;
  for (let i = player.deathBirds.length - 1; i >= 0; i--) {
    if (updatePlayerDeathBird(player.deathBirds[i])) player.deathBirds.splice(i, 1);
  }
  const playerWasActive = !player.death;
  if (player.death) updateDeath(player);
  else if (player.spawn) updateSpawn();
  else updatePlayer();
  for (const enemy of enemies) {
    if (enemy.death) updateDeath(enemy);
    else if (enemy.active) updateEnemy(enemy);
    updateEgg(enemy);
    updateRescueBird(enemy);
    updateHatchlingCollision(enemy);
    if (enemy.hatchling) enemy.hatchling.animationClock += 1 / 60;
  }

  for (let i = 0; i < enemies.length; i++) {
    const first = enemies[i];
    if (!first.active || first.death) continue;
    for (let j = i + 1; j < enemies.length; j++) {
      const second = enemies[j];
      if (!second.active || second.death) continue;
      const close = wrappedHorizontalGap(first.x, second.x) < riderHalfWidth * 2 &&
        Math.abs(first.y - second.y) < riderHalfHeight * 2;
      if (!close) continue;
      if (Math.abs(first.y - second.y) < 1) bounceFromTie(first, second);
      else startDeath(first.y < second.y ? second : first);
    }
  }

  if (playerWasActive && !player.death && !player.spawn) {
    for (const enemy of enemies) {
      if (!enemy.active || enemy.death) continue;
      const close = wrappedHorizontalGap(player.x, enemy.x) < riderHalfWidth * 2 &&
        Math.abs(player.y - enemy.y) < riderHalfHeight * 2;
      if (!close) continue;
      if (Math.abs(player.y - enemy.y) < 1) {
        bounceFromTie(player, enemy);
      } else if (player.y < enemy.y) {
        score += enemyScoreValue(enemy.type);
        startDeath(enemy);
      } else {
        startDeath(player);
      }
      break;
    }
  }

  updatePterodactyls();
  updateWaveProgression();
}
function getMountedRiderTintMap(type) {
  if (!['hunter', 'shadow'].includes(type)) return null;
  if (mountedTintMaps[type]) return mountedTintMaps[type];
  if (!spriteSheet.complete || !spriteSheet.naturalWidth) return null;
  try {
    const sampleCell = sourceX => {
      const sample = document.createElement('canvas');
      sample.width = 14; sample.height = 20;
      const sampleCtx = sample.getContext('2d', { willReadFrequently: true });
      sampleCtx.drawImage(spriteSheet, sourceX, 193, 14, 20, 0, 0, 14, 20);
      return sampleCtx.getImageData(0, 0, 14, 20).data;
    };
    const red = sampleCell(mountedRiderPaletteCells.bounder);
    const target = sampleCell(mountedRiderPaletteCells[type]);
    const pairCounts = new Map();
    for (let y = 0; y < 6; y++) {
      for (let x = 2; x <= 7; x++) {
        const offset = (y * 14 + x) * 4;
        if (!red[offset + 3] || !target[offset + 3]) continue;
        const from = `${red[offset]},${red[offset + 1]},${red[offset + 2]}`;
        const to = `${target[offset]},${target[offset + 1]},${target[offset + 2]}`;
        if (from === to) continue;
        const key = `${from}|${to}`;
        pairCounts.set(key, (pairCounts.get(key) || 0) + 1);
      }
    }
    const bestPairs = new Map();
    for (const [pair, count] of pairCounts) {
      const [from, to] = pair.split('|');
      if (count > (bestPairs.get(from)?.count || 0)) bestPairs.set(from, { to, count });
    }
    const tintMap = new Map([...bestPairs].map(([from, pair]) => [from, pair.to]));
    mountedTintMaps[type] = tintMap;
    return tintMap;
  } catch (error) {
    mountedTintMaps[type] = new Map();
    return null;
  }
}
function tintedMountedFrame(frame, type) {
  const tintMap = getMountedRiderTintMap(type);
  if (!tintMap?.size) return frame;
  const width = frame.width || 14;
  const height = frame.height || 20;
  const key = `${type}:${frame.x}:${frame.y}:${width}:${height}`;
  if (tintedFrameCache.has(key)) return tintedFrameCache.get(key);
  const buffer = document.createElement('canvas');
  buffer.width = width; buffer.height = height;
  const bufferCtx = buffer.getContext('2d', { willReadFrequently: true });
  try {
    bufferCtx.drawImage(spriteSheet, frame.x, frame.y, width, height, 0, 0, width, height);
    const pixels = bufferCtx.getImageData(0, 0, width, height);
    for (let index = 0; index < pixels.data.length; index += 4) {
      const from = `${pixels.data[index]},${pixels.data[index + 1]},${pixels.data[index + 2]}`;
      const to = tintMap.get(from);
      if (!to) continue;
      const [r, g, b] = to.split(',').map(Number);
      pixels.data[index] = r;
      pixels.data[index + 1] = g;
      pixels.data[index + 2] = b;
    }
    bufferCtx.putImageData(pixels, 0, 0);
  } catch (error) {
    return frame;
  }
  const tintedFrame = { ...frame, image: buffer };
  tintedFrameCache.set(key, tintedFrame);
  return tintedFrame;
}
function drawAtlasSprite(frame, x, y, width, height, facingLeft = false) {
  if (!spriteSheet.complete || !spriteSheet.naturalWidth) return;
  const sourceWidth = frame.width || 14;
  const sourceHeight = frame.height || 20;
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  if (facingLeft) {
    ctx.translate(x * 2, 0);
    ctx.scale(-1, 1);
  }
  if (frame.image) {
    ctx.drawImage(frame.image, 0, 0, sourceWidth, sourceHeight,
      x - width / 2, y - height / 2 + (frame.offsetY || 0), width, height);
  } else {
    ctx.drawImage(spriteSheet, frame.x, frame.y, sourceWidth, sourceHeight,
      x - width / 2, y - height / 2 + (frame.offsetY || 0), width, height);
  }
  ctx.restore();
}
function drawRider(rider, frames, facingLeft) {
  let frame = frames[Math.floor(rider.animationClock / 180) % frames.length];
  if (rider.type === 'hunter' || rider.type === 'shadow') {
    frame = tintedMountedFrame(frame, rider.type);
  }
  drawAtlasSprite(frame, rider.x, rider.y, riderSpriteWidth,
    frame.drawHeight || riderSpriteHeight, facingLeft);
}
function drawPixelPattern(pattern, palette, centerX, centerY, pixelSize) {
  const width = pattern[0].length;
  const height = pattern.length;
  const left = centerX - width * pixelSize / 2;
  const top = centerY - height * pixelSize / 2;
  for (let y = 0; y < height; y++) {
    const row = pattern[y];
    for (let x = 0; x < width; x++) {
      const pixel = row[x];
      if (pixel === '.') continue;
      ctx.fillStyle = palette[pixel];
      ctx.fillRect(left + x * pixelSize, top + y * pixelSize, pixelSize, pixelSize);
    }
  }
}
function drawEgg(item) {
  drawPixelPattern(eggPattern, eggPalette, item.x, item.y, 2);
  if (item.landed && item.hatchTimer < 1.2) {
    ctx.fillStyle = '#75411b';
    ctx.fillRect(item.x - 1, item.y - 3, 2, 5);
    ctx.fillRect(item.x + 2, item.y, 2, 4);
  }
}
function drawHatchling(item) {
  const bob = Math.round(Math.sin(item.animationClock * 5));
  drawAtlasSprite(item.riderFrame, item.x, item.y + bob, 29, 58);
}
function drawRescueBird(bird) {
  const frames = enemyDeathFlightFrames;
  const frame = frames[Math.floor(bird.animationClock * 7) % frames.length];
  drawAtlasSprite(frame, bird.x, bird.y, 50, 48, bird.vx < 0);
}
function drawDeathBird(rider, death, facingLeft) {
  if (death.phase === 'walk') {
    const isEnemy = rider !== player;
    const walkFrames = !isEnemy ? loneBirdWalkFrames : enemyDeathWalkFrames;
    const frame = walkFrames[Math.floor(death.elapsed * 6) % walkFrames.length];
    if (isEnemy) {
      drawAtlasSprite(frame, death.birdX, death.birdY + 9, 50, 48, facingLeft);
    } else {
      drawAtlasSprite(frame, death.birdX, death.birdY, riderSpriteWidth, riderSpriteHeight, facingLeft);
    }
    return;
  }
  if (rider === player) {
    const frame = loneBirdFrames[Math.floor(death.elapsed * 4) % loneBirdFrames.length];
    drawAtlasSprite(frame, death.birdX, death.birdY, 50, 48, facingLeft);
    return;
  }
  const frame = enemyDeathFlightFrames[Math.floor(death.elapsed * 4) % enemyDeathFlightFrames.length];
  drawAtlasSprite(frame, death.birdX, death.birdY, 50, 48, facingLeft);
}
function drawDeath(rider) {
  const death = rider.death;
  if (!death) return;
  if (death.elapsed < 0.3) {
    drawAtlasSprite({ x: 247, y: 170, width: 7, height: 9 },
      death.riderX, death.riderY, 24, 20);
  } else if (death.elapsed < 0.78) {
    drawAtlasSprite({ x: 255, y: 170, width: 10, height: 11 },
      death.riderX, death.riderY, 30, 30);
  } else if (death.elapsed < 1.425) {
    drawAtlasSprite({ x: 265, y: 170, width: 12, height: 11 },
      death.riderX, death.riderY, 36, 34);
  }
  const birdGone = death.birdX < -45 || death.birdX > canvas.width + 45 ||
    death.birdY < -45 || death.birdY > canvas.height + 45;
  if (!birdGone) {
    drawDeathBird(rider, death, death.direction < 0);
  }
}
function drawScore() {
  if (!spriteSheet.complete || !spriteSheet.naturalWidth) return;
  const digits = String(Math.max(0, Math.floor(score)));
  const left = 270;
  const top = 520;
  const digitWidth = 10;
  const digitHeight = 14;
  const digitAdvance = 12;
  ctx.save();
  ctx.globalAlpha = 0.65;
  ctx.imageSmoothingEnabled = false;
  for (let i = 0; i < digits.length; i++) {
    const digit = Number(digits[i]);
    ctx.drawImage(spriteSheet, 2 + digit * 6, 299, 5, 7,
      left + i * digitAdvance, top, digitWidth, digitHeight);
  }
  ctx.restore();
}
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.imageSmoothingEnabled = false;
  // The sprite sheet's upper-left panel contains the arena backdrop and platforms.
  if (spriteSheet.complete && spriteSheet.naturalWidth) {
    ctx.drawImage(spriteSheet, 0, 42, 238, 198, 0, 0, canvas.width, canvas.height);
  }
  for (const index of removedPlatforms) {
    const platform = platforms[index];
    if (!platform) continue;
    ctx.fillStyle = '#000';
    ctx.fillRect(platform.x, platform.y - 3, platform.width, platform.bottom - platform.y + 5);
  }
  if (waveTime < 1.5) {
    for (let index = 0; index < portalPads.length; index++) {
      const pad = portalPads[index];
      const pulse = 0.4 + 0.35 * Math.sin(gameTime * 5 + index);
      ctx.fillStyle = `rgba(185, 205, 214, ${pulse})`;
      ctx.fillRect(pad.x - 7, pad.y - 3, 14, 4);
    }
  }
  if (lavaActive) {
    ctx.fillStyle = '#ff3b08';
    ctx.fillRect(0, canvas.height - 18, canvas.width, 18);
    if (currentWave >= 4) {
      const handX = trollHandX();
      const handY = canvas.height - Math.min(trollReach, 90);
      ctx.fillStyle = '#a64d00';
      ctx.fillRect(handX - 17, handY, 34, 34);
      ctx.fillRect(handX - 29, handY - 15, 10, 24);
      ctx.fillRect(handX - 9, handY - 22, 10, 29);
      ctx.fillRect(handX + 11, handY - 16, 10, 24);
    }
  }
  const playerWalking = keys.ArrowLeft || keys.ArrowRight || Math.abs(player.vx) > 0.15;
  const playerFrames = !player.onPlatform ? playerFlightFrames
    : playerWalking ? playerWalkFrames : playerStandFrames;
  for (const bird of player.deathBirds) {
    drawDeathBird(player, bird, bird.direction < 0);
  }
  if (player.death) drawDeath(player);
  else if (player.spawn) {
    const frame = playerSpawnFrames[Math.min(playerSpawnFrames.length - 1,
      Math.floor(player.spawn.elapsed * 7))];
    drawAtlasSprite(frame, player.x, player.y, riderSpriteWidth, riderSpriteHeight);
  } else drawRider(player, playerFrames, player.facingLeft);
  for (const enemy of enemies) {
    if (enemy.death) drawDeath(enemy);
    else if (enemy.active) {
      drawRider(enemy, enemy.onPlatform ? enemyWalkFrames : enemyFlightFrames, enemy.vx < 0);
    }
    if (enemy.egg) drawEgg(enemy.egg);
    if (enemy.hatchling) drawHatchling(enemy.hatchling);
    if (enemy.rescueBird) drawRescueBird(enemy.rescueBird);
  }
  for (const bird of pterodactyls) drawPterodactyl(bird);
  ctx.save();
  ctx.font = 'bold 20px monospace';
  ctx.fillStyle = '#f5d938';
  ctx.textAlign = 'left';
  ctx.fillText(`WAVE ${currentWave}`, 18, 30);
  if (eggWave) ctx.fillText('EGG WAVE', 18, 54);
  ctx.restore();
  drawScore();
}
function drawPterodactyl(bird) {
  if (bird.dying) {
    const frameIndex = Math.min(pterodactylDeathFrames.length - 1,
      Math.floor(bird.deathElapsed / 0.24));
    ctx.save();
    ctx.globalAlpha = clamp(1 - bird.deathElapsed / 0.72, 0, 1);
    const frame = pterodactylDeathFrames[frameIndex];
    drawAtlasSprite(frame, bird.x, bird.y, frame.width * 4, frame.height * 4,
      bird.direction < 0);
    ctx.restore();
    return;
  }
  const frame = pterodactylFlightFrames[
    Math.floor(bird.animationClock * 8) % pterodactylFlightFrames.length
  ];
  drawAtlasSprite(frame, bird.x, bird.y, frame.width * 4, frame.height * 4,
    bird.direction < 0);
}
const simulationStep = 1 / 60;
let previousFrameTime = 0;
let accumulatedTime = 0;
function loop(timestamp) {
  if (!previousFrameTime) previousFrameTime = timestamp;
  accumulatedTime += Math.min((timestamp - previousFrameTime) / 1000, 0.1);
  previousFrameTime = timestamp;
  while (accumulatedTime >= simulationStep) {
    update();
    accumulatedTime -= simulationStep;
  }
  draw();
  requestAnimationFrame(loop);
}
resetPlayer();
player.spawn = { elapsed: 0 };
startWave(1);
canvas.focus({ preventScroll: true });
requestAnimationFrame(loop);
